kind = "mobile"
previewPath = "/"
title = "Immersive Gallery"
description = "A premium mobile photography gallery with an immersive viewer, persistent favorites, custom albums, instant search, slideshow mode, and thoughtful display settings."
version = "1.0.0"
id = "artifacts/immersive-gallery"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/" ]
localPort = 19548

[services.development]
run = "pnpm --filter @workspace/immersive-gallery run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/immersive-gallery", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/immersive-gallery", "run", "serve" ]

[services.env]
PORT = "19548"
BASE_PATH = "/"
